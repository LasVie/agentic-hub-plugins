<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网页圈选与批注测试页面</title>
<style>
  body { margin: 0; background: #f4f6fb; color: #17223b; font: 18px system-ui, sans-serif; }
  main { max-width: 720px; margin: 90px auto; padding: 48px; background: white; border-radius: 20px; }
  button { background: #2563eb; color: white; border: 0; border-radius: 10px; padding: 16px 28px; font-size: 20px; }

</style>
<main>
  <h1>网页圈选与批注测试页面</h1>

  <button id="demo-button" type="button">提交测试</button>
  <p id="status">这是独立的测试材料，不包含真实账号或业务数据。</p>
