<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网页 3D 模型瘦身台</title><link rel="stylesheet" href="/web/style.css"></head><body><header><div><div class="eyebrow">本地开发工具 · 真实引擎</div><h1 id="title">网页 3D 模型瘦身台</h1></div><span class="pill" id="version">v1.0.5</span></header><main class="layout"><div id="message" class="notice" hidden></div><p class="intro">处理已有网页GLB资产，通过真实glTF Transform引擎去重、焊接和清理资源。两侧模型均可用鼠标旋转、缩放。</p><section><div class="toolbar"><button id="demo">载入演示模型</button><input id="model-file" type="file" accept=".glb" aria-label="GLB模型文件"><button id="import">导入本地GLB</button><button id="optimize" class="primary">执行模型优化</button><button id="resize-textures">缩小彩色贴图 · 有损</button><button id="load">恢复已保存模型</button><button id="export">导出优化GLB</button><button id="export-report">导出报告</button></div></section><div id="metrics" class="metrics"></div><div class="grid"><section><h2>优化前 · 原始文件</h2><div id="before-view" class="model-view"></div></section><section><h2>优化后 · 实际成品</h2><div id="after-view" class="model-view"></div></section><section class="wide"><h2>引擎结果</h2><pre id="report">载入模型后查看资源数量与实际字节。</pre></section></div><p class="muted">首版仅支持25 MiB以内、资源完全内嵌的标准GLB；不加载外部资源，不处理必须依赖额外解码器的扩展。保存原始文件；不承诺固定压缩率或任意模型完全无损。</p><p class="footer">专用工作目录：<span id="workspace" class="filename"></span> · 数据仅保存在本机</p></main><script type="module" src="/web/app.js"></script></body></html>
