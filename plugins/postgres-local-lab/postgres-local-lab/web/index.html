<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>离线 PostgreSQL 实验台</title><link rel="stylesheet" href="/web/style.css"></head><body><header><div><div class="eyebrow">本地开发工具 · 真实引擎</div><h1 id="title">离线 PostgreSQL 实验台</h1></div><span class="pill" id="version">v1.0.3</span></header><main class="layout"><div id="message" class="notice" hidden></div><p class="intro">真实的PostgreSQL WASM引擎，数据保存在当前插件专用目录。每个项目独立；无需Docker、云数据库账户或数据库服务器。</p><section><div class="toolbar"><label>数据库项目 <input id="project" value="demo" maxlength="48"></label><button id="sample">载入商品示例</button><button id="schema">查看数据表</button><button id="export">导出数据库快照</button></div><label for="sql">SQL语句</label><textarea id="sql" rows="6">SELECT id, name, price, metadata->>'stock' AS stock FROM demo_products ORDER BY price DESC;</textarea><div class="toolbar"><button id="run" class="primary">执行SQL</button><span class="muted">仅操作当前项目；写入语句会真实修改该项目的数据。</span></div></section><div id="metrics" class="metrics"></div><div class="grid"><section><h2>实际查询结果</h2><div id="rows" class="results"><p class="empty">载入示例或执行查询后显示结果</p></div></section><section><h2>字段与执行信息</h2><pre id="details">暂无执行记录</pre></section></div><p class="muted">每次操作有15秒子进程时限；界面最多显示300行。首版不模拟生产并发、复制或任意PostgreSQL扩展。</p><p class="footer">专用工作目录：<span id="workspace" class="filename"></span> · 数据仅保存在本机</p></main><script type="module" src="/web/app.js"></script></body></html>
