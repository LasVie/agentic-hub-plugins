<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前端包体积透视台</title><link rel="stylesheet" href="/web/style.css"></head><body><header><div><div class="eyebrow">本地开发工具 · 真实引擎</div><h1 id="title">前端包体积透视台</h1></div><span class="pill" id="version">v1.0.4</span></header><main class="layout"><div id="message" class="notice" hidden></div><p class="intro">读取实际构建统计，定位模块体积与引入关系。可在独立示例上完成真实Rollup构建，也可导入你的Vite/Rollup Visualizer raw-data文件。</p><section><div class="toolbar"><label>快照名称 <input id="name" value="baseline" maxlength="48"></label><label><input id="large" type="checkbox">扩大示例数据</label><button id="build" class="primary">真实构建示例</button><button id="export">导出交互报告</button></div><div class="toolbar"><input id="stats-file" type="file" accept=".json" aria-label="构建统计文件"><button id="import">导入构建统计</button><span class="muted">示例仅用于演示引擎，不代表你的项目已构建。</span></div></section><div id="metrics" class="metrics"></div><div class="grid"><section class="wide"><h2>交互式模块体积图</h2><iframe id="graph" class="preview" title="构建模块交互图"></iframe></section><section><h2>模块明细</h2><div id="modules" class="results"></div></section><section><h2>快照比较</h2><div class="toolbar"><label>之前 <select id="before"></select></label><label>之后 <select id="after"></select></label><button id="load">载入快照</button><button id="compare">比较变化</button></div><div id="changes" class="results"></div></section></div><p class="muted">首版不执行用户项目的配置脚本；接入现有项目请按README生成raw-data统计。压缩统计是逐模块估计，不等同于HTTP传输字节。</p><p class="footer">专用工作目录：<span id="workspace" class="filename"></span> · 数据仅保存在本机</p></main><script type="module" src="/web/app.js"></script></body></html>
