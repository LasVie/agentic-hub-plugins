<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>离线乐谱工作台</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <div><p class="eyebrow">本机工作台 / 乐谱排版</p><h1>离线乐谱工作台</h1>
    <p>编辑乐谱 XML，检查谱面和音符时序，再导出乐谱或 MIDI。</p></div>
    <div class="version">插件 1.0.0<br>Verovio 6.4.0</div>
  </header>
  <main>
    <section class="editor panel" aria-labelledby="editor-heading">
      <div class="section-title"><span>01</span><h2 id="editor-heading">乐谱输入</h2></div>
      <div class="actions">
        <label class="file-button">选择文件<input id="file" type="file" accept=".xml,.musicxml,.mei"></label>
        <button id="example" type="button">载入示例</button>
        <button id="restore" type="button" disabled>恢复导入原文</button>
      </div>
      <label for="source">MusicXML 或 MEI 原文</label>
      <textarea id="source" spellcheck="false" placeholder="粘贴未压缩的乐谱 XML"></textarea>
      <p class="hint">仅支持受限的五线谱输入。包含文档类型声明或外部资源的文件会被拒绝。</p>
      <div class="actions"><button id="run" class="primary" type="button">排版乐谱</button><button id="cancel" type="button" disabled>取消排版</button></div>
      <p id="status" role="status" aria-live="polite">请导入乐谱或载入示例。</p>
    </section>
    <section class="panel preview" aria-labelledby="preview-heading">
      <div class="section-title"><span>02</span><h2 id="preview-heading">谱面预览</h2></div>
      <div class="toolbar">
        <div class="actions"><button id="previous" type="button" disabled>上一页</button><span id="page-number">—</span><button id="next" type="button" disabled>下一页</button></div>
        <div class="actions"><button id="svg" type="button" disabled>导出本页 SVG</button><button id="midi" type="button" disabled>导出 MIDI</button></div>
      </div>
      <div id="score" class="sheet"></div>
      <p id="empty" class="empty">谱面将在排版完成后显示。</p>
      <div class="inspection">
        <h3>音符检查</h3>
        <p id="note" aria-live="polite">选择谱面上的音符，查看 MIDI 音高、起始时间和时长。</p>
      </div>
    </section>
  </main>
  <footer>乐谱在浏览器本机计算。MIDI 是演奏事件文件。字体、布局和部分记号的导入效果取决于排版引擎。</footer>
</body>
</html>
