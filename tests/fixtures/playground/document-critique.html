<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>README critique — Playground 1.0.0</title><style>
:root{font:16px/1.5 system-ui,sans-serif;color:#e6edf3;background:#10151d;color-scheme:dark}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:24px}h1{font-size:25px}h2{font-size:18px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{min-width:0;background:#19212d;border:1px solid #4b5e76;border-radius:12px;padding:20px}p,small{color:#bcc9d9}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;background:#10151d;border-radius:8px}button,textarea,select{font:inherit}button{padding:7px 10px;border:1px solid #718198;border-radius:6px;background:#283c50;color:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #72d9ce;outline-offset:3px}button[aria-pressed=true]{border-color:#72d9ce;background:#214b4e}.actions{display:flex;flex-wrap:wrap;gap:8px}textarea,select{max-width:100%;width:100%;background:#10151d;color:inherit;border:1px solid #718198;border-radius:6px;padding:9px}textarea{min-height:85px}.item{padding:14px 0;border-bottom:1px solid #45536a}.item:last-child{border-bottom:0}.item label{display:block;margin-top:12px}.prompt{margin-top:20px}#prompt{height:200px}#copy-status{min-height:24px}label{display:block} @media(max-width:720px){body{padding:16px}main{grid-template-columns:1fr}}
</style></head><body><header><h1>README critique</h1><p>Playground 1.0.0 · Document critique example. Choose the changes you want to request.</p></header><main><section><h2>Example source document</h2><pre id="document"></pre><small>Example content is embedded locally. No file is modified by this page.</small></section><section><h2>Review suggestions</h2><label for="filter">Show suggestions</label><select id="filter"><option value="all">All</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><p id="counts" aria-live="polite"></p><div id="suggestions"></div></section></main><section class="prompt"><h2>Request for your coding agent</h2><label for="prompt">Approved changes and your additional feedback</label><textarea id="prompt" readonly></textarea><button id="copy">Copy prompt</button><p id="copy-status" role="status"></p></section><script>
'use strict';
const source='# Example Widget\n\nInstall the tool.\nRun it.\n\nSample literal source: <img src=x onerror="window.injected=true">';
const state={filter:'all',suggestions:[{id:'install',line:3,text:'Add the exact installation command and prerequisites.',status:'pending',comment:''},{id:'run',line:4,text:'Show a complete run command and expected output.',status:'pending',comment:''}]};
const byId=id=>document.getElementById(id);byId('document').textContent=source;
function updatePrompt(){
 const approved=state.suggestions.filter(s=>s.status==='approved');const additional=state.suggestions.filter(s=>s.comment.trim()&&s.status!=='approved');const rejected=state.suggestions.filter(s=>s.status==='rejected');let text='';
 if(approved.length||additional.length){text='Review the supplied Example Widget README.\n';if(approved.length)text+='\nApply these approved changes:\n'+approved.map(s=>'Line '+s.line+': '+s.text+(s.comment.trim()?' User note: '+s.comment.trim():'')).join('\n');if(additional.length)text+='\n\nAdditional user feedback:\n'+additional.map(s=>'Line '+s.line+' ('+s.status+'): '+s.comment.trim()).join('\n');if(rejected.length)text+='\n\nContext only — do not apply these rejected suggestions:\n'+rejected.map(s=>'Line '+s.line+': '+s.text).join('\n');}
 byId('prompt').value=text;byId('copy').disabled=!text;byId('copy-status').textContent='';
}
function render(){
 byId('counts').textContent=['pending','approved','rejected'].map(status=>state.suggestions.filter(s=>s.status===status).length+' '+status).join(', ');byId('suggestions').replaceChildren();
 for(const suggestion of state.suggestions.filter(s=>state.filter==='all'||s.status===state.filter)){
  const card=document.createElement('article');card.className='item';card.dataset.id=suggestion.id;const title=document.createElement('p');title.textContent='Line '+suggestion.line+' · '+suggestion.text;card.append(title);const actions=document.createElement('div');actions.className='actions';
  for(const [value,label] of [['approved','Approve'],['rejected','Reject'],['pending','Reset']]){const button=document.createElement('button');button.type='button';button.dataset.status=value;button.textContent=label;button.setAttribute('aria-pressed',String(suggestion.status===value));button.addEventListener('click',()=>{suggestion.status=value;render();});actions.append(button);}card.append(actions);
  const label=document.createElement('label');label.htmlFor='note-'+suggestion.id;label.textContent='Your comment';const note=document.createElement('textarea');note.id=label.htmlFor;note.value=suggestion.comment;note.addEventListener('input',event=>{suggestion.comment=event.target.value;updatePrompt();});card.append(label,note);byId('suggestions').append(card);
 }updatePrompt();
}
byId('filter').addEventListener('change',event=>{state.filter=event.target.value;render();});byId('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(byId('prompt').value);byId('copy-status').textContent='Copied!';}catch{byId('prompt').focus();byId('prompt').select();byId('copy-status').textContent='Clipboard unavailable. Copy the selected prompt manually.';}});render();
</script></body></html>
