<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order query explorer — Playground 1.0.0</title><style>
:root{font:16px/1.5 system-ui,sans-serif;color:#e6edf3;background:#10151d;color-scheme:dark}*{box-sizing:border-box}body{max-width:1050px;margin:auto;padding:24px}h1{font-size:25px}h2{font-size:18px}main{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}section,aside{min-width:0;border:1px solid #405067;border-radius:12px;padding:20px;background:#19212d}label{display:block;margin-top:18px}input,select,button,textarea{font:inherit}input,select,textarea{width:100%;padding:8px;background:#10151d;color:inherit;border:1px solid #718198;border-radius:5px}button{padding:8px 10px;border:1px solid #718198;border-radius:6px;background:#2b4050;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #72d9ce;outline-offset:3px}.presets{display:flex;gap:8px;flex-wrap:wrap}pre{overflow:auto;max-width:100%;padding:15px;background:#10151d;border-radius:8px}textarea{height:160px;resize:vertical}small,p{color:#b2c2d4}.error{color:#ffd17f;min-height:25px}@media(max-width:700px){body{padding:16px}main{grid-template-columns:1fr}}
</style></head><body><header><h1>Order query explorer</h1><p>Playground 1.0.0 · Data explorer example. This page builds a query; it never executes SQL.</p></header><main><aside><h2>Filter example orders</h2><div class="presets"><button data-preset="all">All orders</button><button data-preset="paid">Paid orders</button><button data-preset="large">High value</button></div><label for="status">Status</label><select id="status"><option value="">Any status</option><option value="paid">Paid</option><option value="pending">Pending</option></select><label for="minimum">Minimum total</label><input id="minimum" type="number" min="0" max="1000000" value="0"><label for="limit">Maximum rows <output id="limit-value">25</output></label><input id="limit" type="range" min="1" max="100" value="25"><p id="error" class="error" role="status"></p></aside><section><h2>Query preview</h2><small>Example schema: orders(id INTEGER, status TEXT, total DECIMAL)</small><pre id="query" aria-live="polite"></pre><h2>Request for your coding agent</h2><textarea id="prompt" aria-label="Generated prompt" readonly></textarea><button id="copy">Copy prompt</button><p id="copy-status" role="status"></p></section></main><script>
'use strict';
const state={status:'',minimum:0,limit:25};const defaults={...state};const byId=id=>document.getElementById(id);
function render(){
 byId('limit-value').textContent=String(state.limit);byId('copy-status').textContent='';
 const valid=Number.isFinite(state.minimum)&&state.minimum>=0&&state.minimum<=1000000;
 byId('error').textContent=valid?'':'Enter a minimum between 0 and 1,000,000.';byId('copy').disabled=!valid;
 if(!valid){byId('query').textContent='Query unavailable until the minimum total is valid.';byId('prompt').value='';return;}
 const conditions=[];if(state.status)conditions.push("status = '"+state.status+"'");if(state.minimum!==defaults.minimum)conditions.push('total >= '+state.minimum);
 byId('query').textContent='SELECT id, status, total\nFROM orders'+(conditions.length?'\nWHERE '+conditions.join(' AND '):'')+'\nORDER BY id ASC\nLIMIT '+state.limit+';';
 const changes=[];if(state.status)changes.push('include only '+state.status+' orders');if(state.minimum!==defaults.minimum)changes.push('require total to be at least '+state.minimum);if(state.limit!==defaults.limit)changes.push('return at most '+state.limit+' rows');
 byId('prompt').value='Write a read-only SQL query for the example table orders(id INTEGER, status TEXT, total DECIMAL), selecting id, status, and total ordered by id ascending. '+(changes.length?changes.join(', ')+'.':'Use the default unfiltered limit of 25 rows.')+' Do not execute it or connect to a database.';
}
for(const id of ['status','minimum','limit'])byId(id).addEventListener('input',event=>{state[id]=id==='status'?event.target.value:event.target.value===''?NaN:Number(event.target.value);render();});
const presets={all:{...defaults},paid:{status:'paid',minimum:0,limit:50},large:{status:'paid',minimum:100,limit:10}};
document.querySelectorAll('[data-preset]').forEach(button=>button.addEventListener('click',()=>{Object.assign(state,presets[button.dataset.preset]);for(const id of ['status','minimum','limit'])byId(id).value=state[id];render();}));
byId('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(byId('prompt').value);byId('copy-status').textContent='Copied!';}catch{byId('prompt').focus();byId('prompt').select();byId('copy-status').textContent='Clipboard unavailable. Copy the selected prompt manually.';}});render();
</script></body></html>
